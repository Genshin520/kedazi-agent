[project]
name = "kedazi"
version = "0.2.0"
description = "课搭子：基于课程资料的多模态学习助手"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "langchain>=1.2,<2", "langchain-openai>=1.1,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "langchain-text-splitters>=1,<2",
  "langchain-mcp-adapters>=0.2,<0.3", "mcp>=1.25,<2",
  "pydantic-settings>=2.7,<3", "aiosqlite>=0.21,<1",
  "numpy>=2,<3", "rank-bm25>=0.2.2,<0.3", "jieba>=0.42.1,<0.43",
  "dashscope>=1.25,<2", "oss2>=2.19,<3", "pillow>=11,<13",
  "python-multipart>=0.0.20,<1"
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/kedazi"]
